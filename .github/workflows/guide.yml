name: Guide TV

# Toutes les 3 heures (minute 23 pour éviter les heures pleines), à la main, et à chaque modification du code.
on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: guide
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests (heures, changements d'heure, fusion, sport)
        run: node --test test/*.test.mjs
      - name: Génération du guide
        run: node src/build.mjs --out dist
      # Publication : la branche « data » ne contient que la dernière génération (un seul commit, remplacé à chaque
      # fois, pour que le dépôt ne grossisse pas). Fichiers lisibles sur
      # https://raw.githubusercontent.com/AGENCE-BUZZLE/epg/data/<fichier> (et sur GitHub Pages si activé sur cette branche).
      - name: Publication sur la branche data
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q -b data
          git add -A
          git -c user.name="guide-tv" -c user.email="guide-tv@users.noreply.github.com" commit -q -m "Guide du $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
